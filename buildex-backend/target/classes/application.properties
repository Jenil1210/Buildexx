spring.application.name=buildex-backend

# ===============================
# DATABASE (H2 - LOCAL FILE DB) - ACTIVE
# ===============================
spring.datasource.url=jdbc:h2:file:./data/buildex;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DATABASE (SUPABASE) - DISABLED (host non-existent, re-enable when Supabase is restored)
# spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:Dhyey@28@Visodiya}
# spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=7
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=BuildexPool

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:buildexx}
cloudinary.api_key=${CLOUDINARY_API_KEY:933257613118445}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:FiGbAJHeogIXq-H1S6m7Xey1rRw}

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===============================
# SERVER
# ===============================
server.port=8081

# ===============================
# EMAIL (RESEND API)
# ===============================
resend.api.key=${RESEND_API_KEY:re_isWBNR3v_Dfsw1V2yzQc57ykm4SA8WTJa}
resend.api.url=https://api.resend.com/emails

# SMTP
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:re_isWBNR3v_Dfsw1V2yzQc57ykm4SA8WTJa}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# PERFORMANCE (GZIP)
# ===============================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===============================
# FRONTEND URL
# ===============================
app.frontend.url=http://localhost:5173